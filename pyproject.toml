[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-kin-core"
version = "0.1.0"
description = "Public core for geo-kin retargeting: typed messages, solver protocol, robot spec tooling, and a mink-based fallback solver."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
# URDF/MJCF -> (R,p,h) npz generation. Dev-time only; runtime consumers load
# the cached npz with numpy alone. (MJCF hand parsing is ElementTree + scipy —
# no mujoco needed.)
spec-tools = ["pin>=4.0.0", "scipy"]
# Mink differential-IK fallback session (mink pulls in mujoco + qpsolvers;
# scipy for the torso rotation-vector mapping).
fallback = ["mink", "quadprog", "scipy"]
# Shared MuJoCo overlays (geo_kin_core.viz): human skeleton + solver capsules.
viz = ["mujoco"]

[tool.setuptools.packages.find]
include = ["geo_kin_core*"]
